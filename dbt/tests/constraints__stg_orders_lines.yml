version: 2
models:
 - name: stg_orders_lines
   columns:
     - name: order_id
       data_type: bigint
       tests:
         - unique
         - not_null
     - name: line_number
       data_type: int
       tests:
         - not_null
     - name: product_id
       data_type: bigint
       tests:
         - not_null
     - name: quantity
       data_type: int
     - name: unit_price
       data_type: decimal(10, 4)
     - name: line_discount_percent
       data_type: decimal(10, 4)
     - name: tax_percent
       data_type: decimal(10, 4)
     - name: staging_ts
       data_type: timestamp